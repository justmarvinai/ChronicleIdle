name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build derived assets
        run: pnpm assets:build
      - name: Generated manifest is up to date
        run: git diff --exit-code -- src/assets/manifest.generated.ts
      - run: pnpm content:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Campaign difficulty bands hold
        run: pnpm sim:balance --strict --runs 8
      - name: Economy bands hold
        run: pnpm sim:economy --strict
      - run: pnpm build
      - name: Static performance budgets hold
        run: pnpm perf:budget --strict

  e2e:
    # Each spec drives a WebGL battle stage through swiftshader and runs one worker
    # (`playwright.config.ts`), so the suite is serial inside a job and grows with every phase:
    # Phase 10's boss race alone is a 50-turn fight. Sharding gives each half its own runner —
    # no two stages on one machine, and the wall-clock stays in sight of a coffee.
    name: e2e ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build derived assets
        run: pnpm assets:build
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # No `--` separator: pnpm 10 swallows flags after it, and the shard would silently be the
      # whole suite in each job.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        env:
          CI: 'true'
      # One shard is enough for an audit of the document, and shard 1 already has the build and a
      # Chromium installed. `pnpm preview` is backgrounded because Lighthouse needs it serving.
      - name: Lighthouse (shard 1 only)
        if: matrix.shard == 1
        run: |
          pnpm preview &
          pnpm perf:lighthouse --strict
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7
