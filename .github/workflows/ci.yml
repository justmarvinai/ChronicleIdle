name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build derived assets
        run: pnpm assets:build
      - name: Generated manifest is up to date
        run: git diff --exit-code -- src/assets/manifest.generated.ts
      - run: pnpm content:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Campaign difficulty bands hold
        run: pnpm sim:balance --strict --runs 8
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
